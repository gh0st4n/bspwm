# WirePlumber configuration for auto-detecting HDMI audio
# Place this in ~/.config/wireplumber/wireplumber.conf.d/ or /etc/wireplumber/wireplumber.conf.d/

monitor.alsa.rules = [
  {
    matches = [
      {
        device.name = "~alsa_card.*"
      }
    ]
    actions = {
      update-props = {
        auto-profile = true
      }
    }
  }
]